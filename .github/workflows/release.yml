name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --mac --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: dist/*.dmg

  build-win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:linux:all -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*.AppImage

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          body: |
            # Download MinAmp

            MinAmp is available for Mac, Linux, and Windows. Review the list below to select the version appropriate for your system...

            - macOS w/Apple Silicon use: MinAmp-x.x.x-arm64.dmg
            - macOS w/Intel use: MinAmp-x.x.x.dmg
            - Linux on x86 use: MinAmp-x.x.x.AppImage
            - Linux on ARM use: MinAmp-x.x.x-arm64.AppImage
            - Windows x86/64 use: MinAmp.Setup.x.x.x.exe

            ## Note for macOS

            macOS blocks apps from "unverified" developers by default. Review the following documentation for more information on how to manage these settings: [https://support.apple.com/en-us/102445](https://support.apple.com/en-us/102445)
          generate_release_notes: true
